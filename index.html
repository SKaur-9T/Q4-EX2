<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Election 2025</title>
  <link rel="stylesheet" href="style.css">

</head>
<body>

  <script src="main.js"></script>

  <div class="container my-4 p-4" id="title">
    <h2>Election 2025</h2>
    <hr>
  </div>

  <div class="container" id="verification">
    <h4>Voter's Verification</h4>
    <form>
      
      <div class="form-row">
      <div class="col">
      <label>Name</label>
      <input type="text" class="form-control" id="inputName" placeholder="Full name" onchange="changetoCapital()" required>
    </div>
        
      <div class="col">
      <label>Age</label>
      <input type="number" class="form-control" id="inputAge" placeholder="Age" required>
    </div>
  </div>
      
      <br>
      <label>Email</label>
      <input type="email" class="form-control" id="inputEmail" placeholder="Email address" required>
    </form>

    <div class="text-center mt-3">
      <button class="btn btn-primary" onclick="verifyAge()">Verify</button>
      <button class="btn btn-secondary" onclick="location.reload()">Refresh</button>
   
    </div>
  </div>

   <footer>
      <p>Simrandip Kaur | 9 - Topaz</p>
  </footer>

</body>
</html>
